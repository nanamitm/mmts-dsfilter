[MMTS]
; Font family used in generated ASS subtitles.
;FontName=MS Gothic

; Caption text transparency: 0=opaque, 100=fully transparent.
CaptionTransparency=0

; Reserved for ASS background rectangles.
; This is read now and will be used when background rendering is added.
BackgroundTransparency=50

; Reserved for ASS background rectangles: 1=show, 0=hide.
ShowBackground=1

; Text outline width: 0=none, 1-10=ASS \bord value.
OutlineWidth=0

; Subtitle display delay in milliseconds. Negative values show earlier.
DelayMs=0
