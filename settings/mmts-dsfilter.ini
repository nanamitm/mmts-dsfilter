[MMTS]
; Font family used in generated ASS subtitles.
;FontName=MS Gothic

; Caption text transparency: 0=opaque, 100=fully transparent.
CaptionTransparency=0

; ASS cell background transparency: 0=opaque, 100=fully transparent.
BackgroundTransparency=50

; ASS cell background rectangles: 1=show, 0=hide.
ShowBackground=1

; Text outline width: 0=none, 1-10=ASS \bord value.
OutlineWidth=0

; Full-width brackets (U+300C-U+300F, U+3010-U+3011) are transmitted as
; MSZ (half-width) in ARIB broadcasts. Set to 1 to render them at half
; width (\fscx50) matching ARIB font metrics. Set to 0 to render at full
; width, which avoids visual overlap when using general fonts.
AribBracketSquish=1

; Subtitle display delay in milliseconds. Negative values show earlier.
DelayMs=0

; Debug: save raw TTML subtitle samples and subtitle resources for investigation.
DumpSubtitleData=0

; Debug dump directory. Empty uses "subtitle_dump" next to mmts-dsfilter.ax.
DumpSubtitleDir=

; Maximum number of subtitle samples/resources to dump.
DumpSubtitleMaxFiles=200
