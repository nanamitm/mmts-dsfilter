name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    # build.ps1 and the test runners use the v143 (Visual Studio 2022)
    # toolset; windows-latest moves to newer Visual Studio images that need
    # not carry it.
    runs-on: windows-2022

    steps:
      - name: Checkout mmts-dsfilter
        uses: actions/checkout@v6
        with:
          path: mmts-dsfilter

      - name: Checkout dantto4k
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/dantto4k
          # Pinned: the project compiles dantto4k sources directly, so an
          # unpinned default branch can break this build without warning
          # (e.g. a renamed source file invalidates the vcxproj file list).
          # Bump deliberately after verifying against a dantto4k release.
          ref: v20261015
          path: dantto4k

      - name: Build Release
        shell: pwsh
        working-directory: mmts-dsfilter
        run: ./build.ps1 -Configuration Release

      # Regression tests against the Release objects just built and the pinned
      # dantto4k checkout beside this repository. Fixtures are generated.
      - name: Run regression tests
        shell: pwsh
        working-directory: mmts-dsfilter
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\run_subtitle_state_test.cmd
          if ($LASTEXITCODE -ne 0) { throw "subtitle_state_test failed with exit code $LASTEXITCODE" }
          foreach ($test in 'subtitle_file_index_test', 'subtitle_render_test', 'playback_state_test') {
            ./tools/run_subtitle_file_index_test.ps1 -Test $test
          }

      - name: Verify debug file logging is disabled by default
        shell: pwsh
        working-directory: mmts-dsfilter
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Get-Content -LiteralPath 'msvc\mmts-dsfilter.vcxproj' -Raw
          if ($project -match 'MMT_TLV_FILE_LOG|MMT_TLV_VERBOSE_LOG') {
            throw 'Release project must not define debug logging preprocessor flags.'
          }

          $ini = Get-Content -LiteralPath 'settings\mmts-dsfilter.ini' -Raw
          if ($ini -notmatch '(?m)^DebugLogPath=\s*$') {
            throw 'Release INI must keep DebugLogPath empty by default.'
          }
          if ($ini -notmatch '(?m)^VerboseLog=0\s*$') {
            throw 'Release INI must keep VerboseLog=0 by default.'
          }

      - name: Create release package
        shell: pwsh
        working-directory: mmts-dsfilter
        run: |
          $ErrorActionPreference = 'Stop'

          $shortSha = ($env:GITHUB_SHA).Substring(0, 7)
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "snapshot-$shortSha" }
          $packageName = "mmts-dsfilter-$version-x64"
          $packageRoot = Join-Path $PWD "artifacts\$packageName"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item -LiteralPath "msvc\x64\Release\mmts-dsfilter.ax" -Destination $packageRoot

          # FFmpeg is linked into the .ax statically; ship its LGPL notice.
          Copy-Item -LiteralPath "thirdparty\ffmpeg\NOTICE.txt" -Destination (Join-Path $packageRoot "FFmpeg-NOTICE.txt")
          Copy-Item -LiteralPath "thirdparty\ffmpeg\COPYING.LGPLv2.1" -Destination (Join-Path $packageRoot "FFmpeg-LICENSE.txt")
          Copy-Item -LiteralPath "scripts\Install_mmts-dsfilter_64.cmd" -Destination $packageRoot
          Copy-Item -LiteralPath "scripts\Uninstall_mmts-dsfilter_64.cmd" -Destination $packageRoot
          Copy-Item -LiteralPath "settings\mmts-dsfilter.ini" -Destination $packageRoot
          Copy-Item -LiteralPath "README.md" -Destination $packageRoot

          $zipPath = Join-Path $PWD "artifacts\$packageName.zip"
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath
          }
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath

          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ZIP=mmts-dsfilter/artifacts/$packageName.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE_ZIP }}
